site_name: RelioDocs Example
site_description: Build guides and documentation for maker projects
site_author: t00dle
site_url: https://t00dle.github.io/reliodocs-example/
repo_url: https://github.com/t00dle/reliodocs-example
repo_name: reliodocs-example

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - B-Lamp: 
      - Bill of Materials: b-lamp/bom.md
      - Build Guide: b-lamp/build-guide.md
